<div class="rubrique_class">
    <mat-form-field>
        <mat-label>Rubrique</mat-label>
        <mat-select (selectionChange)="choix_rubrique($event)">
            @for(item of items;track item)
            {
            <mat-option [value]="item.id">
                {{item.value}}
            </mat-option>
            }
        </mat-select>
    </mat-form-field>

</div>
