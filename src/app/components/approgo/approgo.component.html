<section class="table-update ">
    <div class="table-update__header">
        <h2>Approvisionnements en gasoil</h2>
    </div>
    <div class="table-update__body">
        <div class="row center">
            <div class="col s6 l6">
                <button [ngStyle]="{'margin-bottom':'1rem','margin-top':'1rem'}" (click)="addappro()" mat-flat-button
                    color="primary" matTooltip="Ajouter nouveau" matTooltipPosition="left" aria-label="Ajouter nouveau">
                    <span class="material-icons">
                        playlist_add
                    </span>
                    Nouveau
                </button>
            </div>
            <div class="col s6 l6">
                <button [ngStyle]="{'margin-bottom':'1rem','margin-top':'1rem'}" (click)="quitter()"  mat-flat-button color="warn">
                       Quitter
                </button>
            </div>
        </div>
        <div class="colon2">
            <table mat-table [dataSource]="datasource()" class="booktable" multiTemplateDataRows>

                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef> DATE

                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.date}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="quantite">
                    <th mat-header-cell *matHeaderCellDef> QUANTITE

                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.quantite}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="reception">
                    <th mat-header-cell *matHeaderCellDef> RECEPTIONNISTE

                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.reception}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button (click)="editappro(row)"><mat-icon>edit</mat-icon></button>
                        <button mat-icon-button (click)="deleteappro(row.id)"><mat-icon>delete</mat-icon></button>
                    </td>
                </ng-container>


                <ng-container matColumnDef="expandedDetail">
                    <td mat-cell *matCellDef="let element;let ind=index" [attr.colspan]="displayedColumns.length">
                        <form [formGroup]="formGroup" (ngSubmit)="updateTableData()">
                            <div class="row" *ngIf="element==current_row()">
                                <div class="col s12 l4">
                                    <mat-form-field appearance="fill">
                                        <mat-label>Choisir une date</mat-label>
                                        <input matInput [matDatepicker]="datepicker" formControlName="date"
                                            placeholder="date">
                                        <mat-hint>DD/MM/YYYY</mat-hint>
                                        <mat-datepicker-toggle matIconSuffix [for]="datepicker"></mat-datepicker-toggle>
                                        <mat-datepicker #datepicker>
                                            <mat-datepicker-actions>
                                                <button mat-flat-button matDatepickerCancel
                                                    type="button">Annuler</button>
                                                <button mat-flat-button color="primary" matDatepickerApply
                                                    type="button">Appliquer</button>
                                            </mat-datepicker-actions>
                                        </mat-datepicker>
                                    </mat-form-field>
                                </div>
                                <div class="col s12 l4">
                                    <mat-form-field appearance="fill">
                                        <mat-label>Quantité</mat-label>
                                        <input matInput formControlName="quantite" type="number" placeholder="quantité">
                                        <mat-error></mat-error>
                                    </mat-form-field>
                                </div>
                                <div class="col s12 l4">
                                    <mat-form-field appearance="fill">
                                        <mat-label>Réceptionniste</mat-label>
                                        <input matInput formControlName="reception" type="text"
                                            placeholder="réceptionniste">
                                        <mat-error></mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div class="row center" *ngIf="element==current_row()">
                                <div class="col s12 l3">
                                    <button mat-flat-button type="submit"
                                        [ngStyle]="{'margin-bottom.px':15,'width.%':60}"
                                        [disabled]="!formGroup.valid">{{is_update()?'Modifier':'Enregistrer'}}</button>
                                </div>
                                <div class="col s12 l3">
                                    <button mat-flat-button type="button" (click)="annuler()" color="warn"
                                        [ngStyle]="{'margin-bottom.px':15,'width.%':60}">annuler</button>
                                </div>
                            </div>

                        </form>

                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                    [ngStyle]="{'display':row==current_row()?'none':''}"></tr>
                <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row" [ngStyle]="{'display':row!=current_row()?'none':'',
                        'background-color':'#f5f5f5'
                    }"></tr>

            </table>
        </div>
    </div>
</section>
