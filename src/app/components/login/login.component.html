<div class="login_container">
    <div class="login-header">
        <h1>BIENVENU A SOLUBTP</h1>
        <h2> Solutions informatiques pour gestion de chantiers de BTP</h2>
    </div>
    <div class="login-subheader">
        <h1>LOGIN</h1>
    </div>
    <div class="login-form">
        <form [formGroup]="loginForm" (ngSubmit)="sumitlogin()" class="login-form ">
            <div class="row">
                <div class=" col s12 l12">

                    <input matInput placeholder="email" formControlName="email">

                </div>
                <div class="col s12 l12">
                    <input matInput type="password" placeholder="password" formControlName="password">

                </div>
            </div>

            <div class="row center">
                <div class="col s12 l12">
                    <button mat-flat-button extended [disabled]="!loginForm.valid">Connexion</button>
                </div>
            </div>
        </form>
    </div>
    <div class="login-footer">
        <div class="row">
            <div class="col s12 l12">
                   <p>   {{message()}}</p>    
                 
            </div>
        </div>
    </div>
    <div class="login-spinner">
        <mat-spinner *ngIf="_auth_service.loadings()"></mat-spinner>
    </div>
</div>
